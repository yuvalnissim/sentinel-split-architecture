name: Build and publish backend

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - ".github/workflows/build-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-backend-build
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and publish backend
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, sentinel]
    timeout-minutes: 20

    env:
      AWS_REGION: eu-north-1
      AWS_DEFAULT_REGION: eu-north-1
      AWS_PAGER: ""
      REGISTRY: 485378272094.dkr.ecr.eu-north-1.amazonaws.com
      REPOSITORY: sentinel/backend

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build, test and publish
        shell: bash
        run: |
          set -euo pipefail

          identity="$(aws sts get-caller-identity --query Arn --output text)"
          case "$identity" in
            arn:aws:sts::485378272094:assumed-role/sentinel-private-runner/*)
              echo "Verified private runner IAM role."
              ;;
            *)
              echo "Unexpected runner identity."
              exit 1
              ;;
          esac

          image_tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_uri="${REGISTRY}/${REPOSITORY}:${image_tag}"
          container_name="sentinel-backend-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker_config="$(mktemp -d)"

          cleanup() {
            sudo -n docker rm -f "$container_name" >/dev/null 2>&1 || true
            sudo -n docker image rm "$image_uri" >/dev/null 2>&1 || true
            sudo -n rm -rf "$docker_config"
          }
          trap cleanup EXIT

          sudo -n docker build \
            --pull \
            --tag "$image_uri" \
            apps/backend

          sudo -n docker run --detach \
            --name "$container_name" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            "$image_uri"

          sudo -n docker exec -i "$container_name" python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          base_url = "http://127.0.0.1:8080"

          for attempt in range(30):
              try:
                  with urllib.request.urlopen(base_url + "/healthz", timeout=2) as response:
                      assert response.status == 200
                      assert response.read() == b"ok\n"
                  break
              except (urllib.error.URLError, TimeoutError):
                  if attempt == 29:
                      raise
                  time.sleep(1)

          with urllib.request.urlopen(base_url + "/", timeout=2) as response:
              assert response.status == 200
              assert response.read() == b"Hello from backend\n"

          try:
              urllib.request.urlopen(base_url + "/missing", timeout=2)
          except urllib.error.HTTPError as error:
              assert error.code == 404
          else:
              raise AssertionError("Expected HTTP 404")

          print("Backend checks passed: health, response and unknown route.")
          PY

          aws ecr get-login-password --region "$AWS_REGION" |
            sudo -n docker --config "$docker_config" login \
              --username AWS \
              --password-stdin "$REGISTRY"

          sudo -n docker --config "$docker_config" push "$image_uri"

          digest="$(aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids imageTag="$image_tag" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          {
            echo "### Backend image published"
            echo
            echo "- Image: \`$image_uri\`"
            echo "- Digest: \`$digest\`"
            echo "- Container checks passed."
          } >> "$GITHUB_STEP_SUMMARY"