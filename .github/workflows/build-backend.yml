name: Build and deploy backend

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "k8s/backend/**"
      - ".github/workflows/build-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-backend-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    name: Build, test, publish and deploy backend
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, sentinel]
    timeout-minutes: 30

    env:
      AWS_REGION: eu-north-1
      AWS_DEFAULT_REGION: eu-north-1
      AWS_PAGER: ""
      REGISTRY: 485378272094.dkr.ecr.eu-north-1.amazonaws.com
      REPOSITORY: sentinel/backend

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare temporary deployment directory
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          deployment_dir="$(mktemp -d "$RUNNER_TEMP/sentinel-backend.XXXXXX")"

          echo "DEPLOYMENT_DIR=$deployment_dir" >> "$GITHUB_ENV"
          echo "KUBECONFIG=$deployment_dir/kubeconfig" >> "$GITHUB_ENV"

      - name: Verify runner identity
        shell: bash
        run: |
          set -euo pipefail

          identity="$(aws sts get-caller-identity --query Arn --output text)"

          case "$identity" in
            arn:aws:sts::485378272094:assumed-role/sentinel-private-runner/*)
              echo "Verified private runner IAM role."
              ;;
            *)
              echo "Unexpected runner identity."
              exit 1
              ;;
          esac

      - name: Build, test and publish
        shell: bash
        run: |
          set -euo pipefail

          image_tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_uri="${REGISTRY}/${REPOSITORY}:${image_tag}"
          container_name="sentinel-backend-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker_config="$(mktemp -d)"

          cleanup() {
            sudo -n docker rm -f "$container_name" >/dev/null 2>&1 || true
            sudo -n docker image rm "$image_uri" >/dev/null 2>&1 || true
            sudo -n rm -rf "$docker_config"
          }
          trap cleanup EXIT

          sudo -n docker build \
            --pull \
            --tag "$image_uri" \
            apps/backend

          sudo -n docker run --detach \
            --name "$container_name" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            "$image_uri"

          sudo -n docker exec -i "$container_name" python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          base_url = "http://127.0.0.1:8080"

          for attempt in range(30):
              try:
                  with urllib.request.urlopen(base_url + "/healthz", timeout=2) as response:
                      assert response.status == 200
                      assert response.read() == b"ok\n"
                  break
              except (urllib.error.URLError, TimeoutError):
                  if attempt == 29:
                      raise
                  time.sleep(1)

          with urllib.request.urlopen(base_url + "/", timeout=2) as response:
              assert response.status == 200
              assert response.read() == b"Hello from backend\n"

          try:
              urllib.request.urlopen(base_url + "/missing", timeout=2)
          except urllib.error.HTTPError as error:
              assert error.code == 404
          else:
              raise AssertionError("Expected HTTP 404")

          print("Backend checks passed: health, response and unknown route.")
          PY

          aws ecr get-login-password --region "$AWS_REGION" |
            sudo -n docker --config "$docker_config" login \
              --username AWS \
              --password-stdin "$REGISTRY"

          sudo -n docker --config "$docker_config" push "$image_uri"

          digest="$(aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids imageTag="$image_tag" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid image digest returned by ECR."
            exit 1
          fi

          echo "BACKEND_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=${REGISTRY}/${REPOSITORY}@${digest}" >> "$GITHUB_ENV"

          {
            echo "### Backend image published"
            echo
            echo "- Image: \`$image_uri\`"
            echo "- Digest: \`$digest\`"
            echo "- Container checks passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Render manifests with published image
        shell: bash
        run: |
          set -euo pipefail

          cp k8s/backend/backend.yml "$DEPLOYMENT_DIR/backend.yml"

          cat > "$DEPLOYMENT_DIR/kustomization.yaml" <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - backend.yml
          images:
            - name: ${REGISTRY}/${REPOSITORY}
              newName: ${REGISTRY}/${REPOSITORY}
              digest: ${BACKEND_DIGEST}
          EOF

          kubectl kustomize "$DEPLOYMENT_DIR" \
            > "$DEPLOYMENT_DIR/rendered.yml"

      - name: Configure cluster access
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          aws eks update-kubeconfig \
            --name eks-backend \
            --region "$AWS_REGION" \
            --alias sentinel-backend-deploy \
            --kubeconfig "$KUBECONFIG"

      - name: Validate manifests against Kubernetes API
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply --dry-run=server \
            -f "$DEPLOYMENT_DIR/rendered.yml" \
            --request-timeout=30s

      - name: Deploy backend
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply \
            -f "$DEPLOYMENT_DIR/rendered.yml" \
            --request-timeout=30s

          kubectl -n default rollout status \
            deployment/sentinel-backend \
            --timeout=300s

      - name: Verify deployed image and show resources
        shell: bash
        run: |
          set -euo pipefail

          deployed_image="$(kubectl -n default get deployment sentinel-backend \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="backend")].image}' \
            --request-timeout=20s)"

          if [ "$deployed_image" != "$BACKEND_IMAGE" ]; then
            echo "Deployed image does not match the published image."
            exit 1
          fi

          kubectl -n default get deployment sentinel-backend
          kubectl -n default get service sentinel-backend
          kubectl -n default get ingress sentinel-backend
          kubectl -n default get pods -l app=sentinel-backend -o wide

          {
            echo
            echo "### Backend deployment verified"
            echo
            echo "- Cluster: \`eks-backend\`"
            echo "- Deployed image: \`$deployed_image\`"
            echo "- Deployment rollout completed successfully."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary deployment files
        if: always()
        shell: bash
        run: |
          if [ -n "${DEPLOYMENT_DIR:-}" ] && [ -d "$DEPLOYMENT_DIR" ]; then
            rm -rf -- "$DEPLOYMENT_DIR"
          fi