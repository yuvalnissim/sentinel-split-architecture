name: Terraform deploy

on:
  push:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "modules/eks/policies/**"
      - "scripts/check-cni-bootstrap-plan.py"
      - "tests/**"
      - ".terraform.lock.hcl"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:
    inputs:
      enable_controller_bootstrap:
        description: "Temporarily enable controller installation and diagnostic access"
        type: boolean
        default: false
        required: true
      enable_cni_bootstrap:
        description: "Initial creation only: temporarily grant CNI permissions to nodes"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: sentinel-terraform-state
  cancel-in-progress: false

jobs:
  deploy:
    name: Plan and apply infrastructure
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: bootstrap
    timeout-minutes: 45

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_enable_controller_bootstrap: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_controller_bootstrap && 'true' || 'false' }}
      TF_VAR_enable_cni_bootstrap: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_cni_bootstrap && 'true' || 'false' }}
      AWS_REGION: eu-north-1
      AWS_DEFAULT_REGION: eu-north-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_PAGER: ""

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: "v0.66.0"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize remote state
        run: terraform init -input=false -lockfile=readonly

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Lint Terraform and modules
        run: |
          tflint --init
          tflint --recursive --format compact

      - name: Test bootstrap and environment rendering
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Plan infrastructure
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -lock-timeout=60s \
            -out=deployment.tfplan

      - name: Check initial CNI bootstrap permissions
        shell: bash
        run: |
          set -euo pipefail
          terraform show -json deployment.tfplan |
            python3 scripts/check-cni-bootstrap-plan.py

      - name: Apply saved plan
        run: |
          terraform apply \
            -input=false \
            -no-color \
            -lock-timeout=60s \
            deployment.tfplan

      - name: Show infrastructure outputs
        run: terraform output -no-color

      - name: Remove saved plan
        if: always()
        run: rm -f deployment.tfplan