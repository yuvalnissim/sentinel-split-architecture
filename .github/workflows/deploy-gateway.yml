name: Deploy gateway

on:
  push:
    branches:
      - main
    paths:
      - "k8s/gateway/**"
      - ".github/workflows/deploy-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-gateway-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy gateway
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, sentinel]
    timeout-minutes: 15

    env:
      AWS_REGION: eu-north-1
      AWS_DEFAULT_REGION: eu-north-1
      AWS_PAGER: ""

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure cluster access
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          kubeconfig_path="$RUNNER_TEMP/sentinel-gateway-deploy-kubeconfig"
          echo "KUBECONFIG=$kubeconfig_path" >> "$GITHUB_ENV"

          aws eks update-kubeconfig \
            --name eks-gateway \
            --region "$AWS_REGION" \
            --alias sentinel-gateway-deploy \
            --kubeconfig "$kubeconfig_path"

      - name: Validate manifests against Kubernetes API
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply --dry-run=server \
            -f k8s/gateway/gateway.yml \
            --request-timeout=30s

      - name: Deploy gateway
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -f k8s/gateway/gateway.yml

          kubectl -n default rollout status \
            deployment/sentinel-gateway \
            --timeout=300s

      - name: Show gateway resources
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n default get deployment,service \
            -l app=sentinel-gateway

          kubectl -n default get pods \
            -l app=sentinel-gateway \
            -o wide

          kubectl -n default get service sentinel-gateway

      - name: Remove temporary kubeconfig
        if: always()
        shell: bash
        run: |
          if [ -n "${KUBECONFIG:-}" ]; then
            rm -f "$KUBECONFIG"
          fi
