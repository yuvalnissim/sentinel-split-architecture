name: Build and deploy gateway

on:
  push:
    branches:
      - main
    paths:
      - "apps/gateway/**"
      - "k8s/gateway/**"
      - ".github/workflows/build-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-gateway-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    name: Build, test, publish and deploy gateway
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, sentinel]
    timeout-minutes: 30

    env:
      AWS_REGION: eu-north-1
      AWS_DEFAULT_REGION: eu-north-1
      AWS_PAGER: ""
      REGISTRY: 485378272094.dkr.ecr.eu-north-1.amazonaws.com
      REPOSITORY: sentinel/gateway

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare temporary deployment directory
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          deployment_dir="$(mktemp -d "$RUNNER_TEMP/sentinel-gateway.XXXXXX")"

          echo "DEPLOYMENT_DIR=$deployment_dir" >> "$GITHUB_ENV"
          echo "KUBECONFIG=$deployment_dir/gateway-kubeconfig" >> "$GITHUB_ENV"

      - name: Verify runner identity
        shell: bash
        run: |
          set -euo pipefail

          identity="$(aws sts get-caller-identity --query Arn --output text)"

          case "$identity" in
            arn:aws:sts::485378272094:assumed-role/sentinel-private-runner/*)
              echo "Verified private runner IAM role."
              ;;
            *)
              echo "Unexpected runner identity."
              exit 1
              ;;
          esac

      - name: Select deployed backend image for integration tests
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          backend_kubeconfig="$DEPLOYMENT_DIR/backend-kubeconfig"

          aws eks update-kubeconfig \
            --name eks-backend \
            --region "$AWS_REGION" \
            --alias sentinel-backend-test \
            --kubeconfig "$backend_kubeconfig"

          kubectl --kubeconfig "$backend_kubeconfig" \
            -n default rollout status \
            deployment/sentinel-backend \
            --timeout=300s

          backend_image="$(kubectl --kubeconfig "$backend_kubeconfig" \
            -n default get deployment sentinel-backend \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="backend")].image}' \
            --request-timeout=20s)"

          expected_prefix="${REGISTRY}/sentinel/backend@sha256:"

          if [[ "$backend_image" != "$expected_prefix"* ]]; then
            echo "Backend image must reference the expected ECR repository by digest."
            exit 1
          fi

          backend_digest="${backend_image#"$expected_prefix"}"

          if [[ ! "$backend_digest" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Invalid backend image digest."
            exit 1
          fi

          echo "BACKEND_IMAGE=$backend_image" >> "$GITHUB_ENV"
          echo "Integration test backend: $backend_image"

      - name: Build, test and publish
        shell: bash
        run: |
          set -euo pipefail

          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_tag="${GITHUB_SHA}-${suffix}"
          image_uri="${REGISTRY}/${REPOSITORY}:${image_tag}"
          network_name="sentinel-proxy-test-${suffix}"
          backend_name="sentinel-backend-test-${suffix}"
          gateway_name="sentinel-gateway-test-${suffix}"
          docker_config="$(mktemp -d)"

          cleanup() {
            sudo -n docker rm -f "$gateway_name" "$backend_name" >/dev/null 2>&1 || true
            sudo -n docker network rm "$network_name" >/dev/null 2>&1 || true
            sudo -n docker image rm "$image_uri" >/dev/null 2>&1 || true
            sudo -n rm -rf "$docker_config"
          }
          trap cleanup EXIT

          aws ecr get-login-password --region "$AWS_REGION" |
            sudo -n docker --config "$docker_config" login \
              --username AWS \
              --password-stdin "$REGISTRY"

          sudo -n docker --config "$docker_config" pull "$BACKEND_IMAGE"

          sudo -n docker build --pull \
            --tag "$image_uri" apps/gateway

          sudo -n docker network create "$network_name"

          sudo -n docker run --detach \
            --name "$backend_name" \
            --network "$network_name" \
            --network-alias backend \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            "$BACKEND_IMAGE"

          sudo -n docker run --detach \
            --name "$gateway_name" \
            --network "$network_name" \
            --network-alias gateway \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --env BACKEND_URL=http://backend:8080 \
            --env DNS_RESOLVER=127.0.0.11 \
            "$image_uri"

          sudo -n docker exec -i "$backend_name" python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          def expect(path, expected):
              with urllib.request.urlopen(
                  "http://gateway:8080" + path, timeout=5
              ) as response:
                  assert response.status == 200
                  assert response.read() == expected

          for attempt in range(30):
              try:
                  expect("/healthz", b"ok\n")
                  expect("/", b"Hello from backend\n")
                  break
              except (urllib.error.URLError, TimeoutError):
                  if attempt == 29:
                      raise
                  time.sleep(1)

          try:
              urllib.request.urlopen("http://gateway:8080/missing", timeout=5)
          except urllib.error.HTTPError as error:
              assert error.code == 404
          else:
              raise AssertionError("Expected backend HTTP 404 through proxy")

          print("Gateway checks passed: health, proxy response and forwarded 404.")
          PY

          sudo -n docker --config "$docker_config" push "$image_uri"

          digest="$(aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids imageTag="$image_tag" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid image digest returned by ECR."
            exit 1
          fi

          echo "GATEWAY_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "GATEWAY_IMAGE=${REGISTRY}/${REPOSITORY}@${digest}" >> "$GITHUB_ENV"

          {
            echo "### Gateway image published"
            echo
            echo "- Image: \`$image_uri\`"
            echo "- Digest: \`$digest\`"
            echo "- Integration test backend: \`$BACKEND_IMAGE\`"
            echo "- Proxy integration checks passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Render manifests with published image
        shell: bash
        run: |
          set -euo pipefail

          cp k8s/gateway/gateway.yml "$DEPLOYMENT_DIR/gateway.yml"

          cat > "$DEPLOYMENT_DIR/kustomization.yaml" <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - gateway.yml
          images:
            - name: ${REGISTRY}/${REPOSITORY}
              newName: ${REGISTRY}/${REPOSITORY}
              digest: ${GATEWAY_DIGEST}
          EOF

          kubectl kustomize "$DEPLOYMENT_DIR" \
            > "$DEPLOYMENT_DIR/rendered.yml"

      - name: Configure gateway cluster access
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          aws eks update-kubeconfig \
            --name eks-gateway \
            --region "$AWS_REGION" \
            --alias sentinel-gateway-deploy \
            --kubeconfig "$KUBECONFIG"

      - name: Validate manifests against Kubernetes API
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply --dry-run=server \
            -f "$DEPLOYMENT_DIR/rendered.yml" \
            --request-timeout=30s

      - name: Deploy gateway
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply \
            -f "$DEPLOYMENT_DIR/rendered.yml" \
            --request-timeout=30s

          kubectl -n default rollout status \
            deployment/sentinel-gateway \
            --timeout=300s

      - name: Verify deployed image and show resources
        shell: bash
        run: |
          set -euo pipefail

          deployed_image="$(kubectl -n default get deployment sentinel-gateway \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="gateway")].image}' \
            --request-timeout=20s)"

          if [ "$deployed_image" != "$GATEWAY_IMAGE" ]; then
            echo "Deployed image does not match the published image."
            exit 1
          fi

          kubectl -n default get deployment sentinel-gateway
          kubectl -n default get service sentinel-gateway
          kubectl -n default get ingress sentinel-gateway
          kubectl -n default get pods -l app=sentinel-gateway -o wide

          {
            echo
            echo "### Gateway deployment verified"
            echo
            echo "- Cluster: \`eks-gateway\`"
            echo "- Deployed image: \`$deployed_image\`"
            echo "- Deployment rollout completed successfully."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary deployment files
        if: always()
        shell: bash
        run: |
          if [ -n "${DEPLOYMENT_DIR:-}" ] && [ -d "$DEPLOYMENT_DIR" ]; then
            rm -rf -- "$DEPLOYMENT_DIR"
          fi