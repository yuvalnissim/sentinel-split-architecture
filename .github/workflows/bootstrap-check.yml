name: Check bootstrap AWS access

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-check
  cancel-in-progress: false

jobs:
  check:
    name: Verify AWS identity
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: bootstrap
    timeout-minutes: 5

    env:
      AWS_REGION: eu-north-1
      AWS_DEFAULT_REGION: eu-north-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_PAGER: ""

    steps:
      - name: Verify credentials and account
        shell: bash
        run: |
          set -euo pipefail

          : "${AWS_ACCESS_KEY_ID:?Missing AWS_ACCESS_KEY_ID secret}"
          : "${AWS_SECRET_ACCESS_KEY:?Missing AWS_SECRET_ACCESS_KEY secret}"
          : "${AWS_SESSION_TOKEN:?Missing AWS_SESSION_TOKEN secret}"

          account_id="$(aws sts get-caller-identity \
            --query Account --output text)"

          if [[ "$account_id" != "485378272094" ]]; then
            echo "::error::Unexpected AWS account."
            exit 1
          fi

          echo "Successfully authenticated to the expected AWS account."