apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-backend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinel-backend
  template:
    metadata:
      labels:
        app: sentinel-backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: sentinel-backend
      containers:
        - name: backend
          image: 485378272094.dkr.ecr.eu-north-1.amazonaws.com/sentinel/backend@sha256:ceb0751d421b57dd5d95db4236b18fea0e5788f86f2b0d89e44623cc7c4969c2
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-backend
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: sentinel-backend
  ports:
    - name: http
      port: 80
      targetPort: http



---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinel-backend
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/subnets: subnet-01e79b83d4446cb73,subnet-0681b2828862fa803
    alb.ingress.kubernetes.io/security-groups: sg-05183855e3e10a473
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sentinel-backend
                port:
                  number: 80